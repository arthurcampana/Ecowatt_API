server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota desconhecida cai no index.html, para o
    # react-router resolver no cliente (evita 404 ao recarregar /analytics etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
