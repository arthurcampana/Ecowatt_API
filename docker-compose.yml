# Sobe o EcoWatt completo com um comando:  docker compose up --build
#
#   - postgres : banco de dados (porta 5432)
#   - backend  : API Spring Boot (porta 8080)
#   - frontend : app React servido por Nginx (porta 5500 -> casa com o CORS)
#
# Depois de subir, acesse: http://localhost:5500
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ecowatt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senai
    ports:
      - "5432:5432"
    volumes:
      - ecowatt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecowatt"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./demo/demo
    environment:
      # Aponta para o serviço postgres (não localhost) dentro da rede do compose
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecowatt
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: senai
      # Segredo do JWT (troque em produção)
      JWT_SECRET: MinhaChaveSuperSecretaParaJWTComMaisDe32Caracteres123456
      # Frontends que podem chamar a API (separados por vírgula). Para outro
      # endereço, exporte CORS_ALLOWED_ORIGINS antes do "docker compose up".
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./EcowattFront-React
      args:
        # URL que o browser usa para falar com o backend (porta publicada).
        # Embutida no build: para outro endereço, exporte VITE_API_URL e rode
        # "docker compose up --build".
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "5500:80"
    depends_on:
      - backend

  # Serviço de PREVISÃO (PySpark MLlib): sobe junto com o app e recalcula a
  # previsão de consumo a cada INTERVALO_PREVISAO segundos (padrão 30s), lendo a
  # tabela `consumo` e gravando em `previsao_consumo`. Assim, depois de popular
  # dados (Ctrl+Shift+D), a previsão aparece sozinha ao recarregar — sem abrir
  # terminal. Ver spark/loop_previsao.sh.
  spark:
    build:
      context: ./spark
    command: ["sh", "loop_previsao.sh"]
    environment:
      # Dentro da rede do compose o host do banco e "postgres", nao localhost.
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ecowatt
      PG_USER: postgres
      PG_PASSWORD: senai
      # Saida dos Parquets dentro do container (mapeada no volume abaixo).
      SPARK_DATA_DIR: /app/data
      # Intervalo (segundos) entre recálculos da previsão.
      INTERVALO_PREVISAO: "30"
    restart: unless-stopped
    volumes:
      - ecowatt_spark_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  # Pipeline de ANALYTICS (bronze -> prata -> ouro) em LOTE, sob demanda. Depende
  # da tabela evento_uso, entao fica no profile "analytics" e NAO sobe no up.
  #   docker compose run --rm analytics
  analytics:
    build:
      context: ./spark
    profiles: ["analytics"]
    command: ["sh", "-c", "python bronze.py && python prata.py && python ouro.py"]
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ecowatt
      PG_USER: postgres
      PG_PASSWORD: senai
      SPARK_DATA_DIR: /app/data
    volumes:
      - ecowatt_spark_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ecowatt_pgdata:
  ecowatt_spark_data:
