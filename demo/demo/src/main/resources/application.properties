spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecowatt}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:senai}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
# Log de todo SQL executado: util em desenvolvimento; em producao use SHOW_SQL=false
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Dialect PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Jwt
jwt.secret=${JWT_SECRET:MinhaChaveSuperSecretaParaJWTComMaisDe32Caracteres123456}

# CORS: origens (frontends) que podem chamar a API, separadas por virgula.
# Em producao, defina CORS_ALLOWED_ORIGINS com o dominio publico do frontend,
# ex.: CORS_ALLOWED_ORIGINS=https://ecowatt.exemplo.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}